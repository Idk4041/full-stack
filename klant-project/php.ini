; Toon PHP-fouten in de browser (handig voor ontwikkeling, niet voor productie).
display_errors = On
; LET OP: typfout; moet display_startup_errors zijn, anders wordt de regel genegeerd.
displat_startup_errors = Off
; Standaard host voor mysqli_connect(). In Docker moet dit de servicenaam 'mysql' zijn: 127.0.0.1 wijst naar de PHP-container zelf.
mysqli.default_host = 127.0.0.1
mysqli.default_port = 3306
; Standaard inloggegevens (gelijk aan docker-compose.yml).
mysqli.default_user = student
mysqli.default_pw = veiligwachtwoord
